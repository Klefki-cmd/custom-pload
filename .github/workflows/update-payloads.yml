name: Update payloads.json

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch latest releases and rebuild payloads.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          declare -A REPOS=(
            ["juma-sayeh/PS5-Game-Compressor"]="Game Compressor|game-compressor.elf|Compression|Standalone PS5 payload for compressing, unpacking, validating, and repairing ShadowMountPlus-mounted games."
            ["Phoenixx1202/LegacyJB"]="LegacyJB|LegacyJB.elf|Jailbreak|PS5 payload that provides a jailbreak service for supported applications."
            ["notmaj0r/ProsperoMgr"]="Prospero Manager|ProsperoMgr.elf|Manager|All-In-One manager for your PS5."
            ["Phoenixx1202/Spectrum-Library"]="Spectrum Library|Spectrum-Library.elf|Library|Lightweight native PlayStation 5 content manager."
            ["pegasus-ps5/pegasus-dl"]="Pegasus DL|pegasus_dl.elf|Downloader|Direct package downloading from your PS5."
            ["exFAT2AMPR/exfat2ampr"]="exFAT2AMPR|exfat2ampr.elf|Compression|Convert PS5 game dumps to AMPR LZ4."
          )

          echo '{' > payloads.json
          echo '  "name": "My PS5 Payloads",' >> payloads.json
          echo '  "payloads": [' >> payloads.json

          FIRST=1
          for repo in "${!REPOS[@]}"; do
            IFS='|' read -r NAME FILEPAT CATEGORY DESC <<< "${REPOS[$repo]}"
            RELEASE=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$repo/releases/latest")

            TAG=$(echo "$RELEASE" | jq -r '.tag_name // empty')
            if [ -z "$TAG" ]; then
              echo "Skipping $repo (no release)" >&2
              continue
            fi

            URL=$(echo "$RELEASE" | jq -r --arg f "$FILEPAT" \
              '.assets[] | select(.name == $f) | .browser_download_url' | head -n1)

            if [ -z "$URL" ]; then
              echo "Skipping $repo (asset $FILEPAT not found)" >&2
              continue
            fi

            if [ $FIRST -eq 0 ]; then echo ',' >> payloads.json; fi
            FIRST=0

            cat >> payloads.json <<EOF
              {
                "name": "$NAME",
                "filename": "$FILEPAT",
                "url": "$URL",
                "version": "$TAG",
                "category": "$CATEGORY",
                "description": "$DESC"
              }
          EOF
          done

          echo '  ]' >> payloads.json
          echo '}' >> payloads.json

          cat payloads.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add payloads.json
          git diff --staged --quiet || git commit -m "chore: update payloads.json"
          git pull --rebase origin main
          git push
